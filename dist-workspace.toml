[workspace]
members = ["cargo:."]

# Config for 'dist'. The generated .github/workflows/release.yml is derived from
# this file — do NOT hand-edit the workflow; change this and run `dist generate`.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# The powershell installer returns with the Windows target (task 7) — the shell
# installer is a bash script, so Windows users need this one.
installers = ["shell", "powershell", "homebrew"]
tap = "kennworx/homebrew-tap"
publish-jobs = ["homebrew"]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
# llama.cpp (vendored by kenn-embed) compiles its C++ against the DYNAMIC MSVC
# CRT (/MD), so dist's default `+crt-static` Rust link left 18 unresolved
# `__imp_*` CRT symbols (LNK1120) on x86_64-pc-windows-msvc — the C++ objects
# want dynamic-CRT imports the static UCRT can't provide. Link the dynamic CRT
# to match. The .exe then needs the VC++ runtime (vcruntime140.dll), which
# essentially every dev machine has; a fully-static build would instead force
# llama's C++ to /MT (CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded).
msvc-crt-static = false

# No x86_64-apple-darwin: Intel Macs are not a target worth carrying a build for.
# No musl: kenn-embed vendors llama.cpp, so every build is a C++ build, and a
# static musl build of it is not verified here.
#
# Windows returned in windows-support task 7. Both original blockers are gone:
# `live` is now a pointer file (no unprivileged-symlink flip), and the whole
# workspace compiles on windows-2022 — the `ci-windows.yml` gate (cargo check)
# is green after fixing kenn-store's device-id arm and kenn-server's stale
# windows-sys FFI. `kenn init --docker` also declines cleanly there.
#
# CAVEAT: a failing target still skips `host` and `publish-homebrew-formula`, so
# if a Windows *release build* (heavier than `cargo check` — it links and
# packages) breaks where CI didn't, it blocks the other three platforms too.
# Watch the first tagged release. And CI proves compilation, not that `kenn
# index` runs — that is task 7.3's manual smoke on a real Windows host.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# ONE override, deliberately. dist's defaults are already native for the other
# three; overriding them just means owning a guess that goes stale. It did:
# pinning x86_64-apple-darwin to macos-13 queued forever with no runner ever
# assigned, because that image has been retired — dist's own default,
# macos-15-intel, was correct all along.
#
# This one is load-bearing: dist would otherwise cross-compile aarch64 linux, and
# kenn-embed vendors llama.cpp so every build is a C++ build. Emulation is not an
# alternative either — rustc SIGSEGVs under qemu-x86_64.
#
# Verify with `dist plan`, never by reading the workflow: the matrix is computed
# at run time.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
