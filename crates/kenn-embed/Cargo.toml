[package]
name = "kenn-embed"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
kenn-config = { path = "../kenn-config" }

thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
# `EmbeddingProducer::embed` is `async fn` in a trait used via `dyn` —
# `async-trait` provides the boxed-future indirection needed for dyn-compat.
async-trait = "0.1"

# Async runtime — `LazyEmbedder` does its model load in a
# `spawn_blocking`, the idle-unload runs as a tokio task, and the
# selector + spawn helpers run as regular tasks. `process` is needed
# for `tokio::process::Command` (fork-exec the local daemon).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros", "process"] }

# In-process llama.cpp — `LlamaEmbedder` runtime.
# `default-features = false` drops the default `openmp` feature: with it on,
# llama-cpp-sys builds ggml with `GGML_OPENMP=ON` and dynamically links libgomp on
# gnu targets, so the shipped Linux binary aborts at startup ("libgomp.so.1:
# cannot open shared object file") on a clean host with no system libgomp (verified
# in a bare ubuntu:noble container). ggml falls back to its own pthread pool.
# `android-shared-stdcxx` (the other default) is kept so libstdc++ linking is
# unchanged.
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["android-shared-stdcxx"] }

# `RemoteEmbedder` — OpenAI-compatible HTTP client. Async — drops the
# `blocking` feature since `EmbeddingProducer::embed` is now async.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal does the embedding work here, so OpenMP is irrelevant; drop it too (see
# the base dep) to keep every platform off libgomp/libomp and consistent.
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["metal", "android-shared-stdcxx"] }

[dev-dependencies]
tempfile.workspace = true
