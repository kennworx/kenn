[package]
name = "kenn-toolchain"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Ships as the ENTRYPOINT of every indexer image: it resolves the workspace's
# pinned toolchain, provisions it into the mounted cache volume if absent, then
# execs the real indexer. Being our own binary rather than a shell script is
# what lets the images stay `FROM scratch` — nothing here needs sh or curl.
[lib]
path = "src/lib.rs"

[[bin]]
name = "kenn-toolchain"
path = "src/main.rs"

[dependencies]
# Exclusive flock on the cache's per-destination lock file, so concurrent
# containers sharing one volume download a toolchain once rather than racing.
fs2.workspace = true
thiserror.workspace = true
# Fetch + verify + unpack, all in-process. `ureq` is blocking (the entrypoint
# has nothing else to do while it downloads) and brings rustls, so there is no
# system OpenSSL to install — the point being that this image needs no `sh`,
# no `curl`, and no package manager.
ureq = "3.3"
tar = "0.4"
flate2 = "1.1"
sha2 = "0.10"
# Pin files and vendor release metadata: global.json is JSON,
# rust-toolchain.toml and the Rust channel manifests are TOML.
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
